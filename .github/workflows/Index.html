<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDIM VAI — 3D Effects</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
}

/* 3D Canvas */
#scene{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* Cinematic overlays */
.vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;

    background:
        radial-gradient(
            circle,
            transparent 25%,
            rgba(0,0,0,.25) 55%,
            rgba(0,0,0,.95) 100%
        );
}

.scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:6;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 2px,
            transparent 5px
        );

    opacity:.35;
}

/* Main title */
.title{
    position:fixed;
    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.6);

    z-index:4;

    pointer-events:none;

    text-align:center;

    opacity:0;

    transition:
        opacity 1s ease,
        transform 1.2s cubic-bezier(.15,.8,.2,1);
}

.title h1{
    font-size:
        clamp(55px,13vw,170px);

    font-weight:1000;

    letter-spacing:
        clamp(4px,1.4vw,18px);

    color:white;

    text-transform:uppercase;

    text-shadow:
        0 0 5px white,
        0 0 15px white,
        0 0 35px rgba(0,200,255,.9),
        0 0 80px rgba(0,150,255,.7),
        0 0 150px rgba(80,0,255,.5);

    animation:
        titleGlow 2s infinite alternate;
}

.title p{
    margin-top:12px;

    font-size:
        clamp(10px,1.5vw,18px);

    letter-spacing:8px;

    color:rgba(255,255,255,.75);
}

@keyframes titleGlow{

    from{
        filter:brightness(1);
    }

    to{
        filter:brightness(1.35);
    }
}

/* Glitch */
.glitch{
    animation:
        glitch .18s infinite;
}

@keyframes glitch{

    0%{
        transform:
            translate(-50%,-50%)
            skewX(0);
    }

    20%{
        transform:
            translate(calc(-50% + 6px),-50%)
            skewX(-3deg);
    }

    40%{
        transform:
            translate(calc(-50% - 5px),-50%)
            skewX(3deg);
    }

    60%{
        transform:
            translate(-50%,-50%)
            skewX(0);
    }

    80%{
        transform:
            translate(calc(-50% + 3px),-50%)
            skewX(-1deg);
    }

    100%{
        transform:
            translate(-50%,-50%)
            skewX(0);
    }
}

/* HUD */
.hud{
    position:fixed;
    inset:20px;

    z-index:8;

    pointer-events:none;

    color:rgba(255,255,255,.45);

    font-family:
        "Courier New",monospace;

    font-size:10px;

    letter-spacing:2px;
}

.hudTop,
.hudBottom{
    display:flex;
    justify-content:space-between;
}

.hudBottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
}

.statusDot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 10px white;
}

/* Flash */
.flash{
    position:fixed;
    inset:0;

    z-index:10;

    pointer-events:none;

    background:white;

    opacity:0;
}

/* Mobile */
@media(max-width:600px){

    .hud{
        inset:12px;
    }

    .title p{
        letter-spacing:4px;
    }
}
</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="title" id="title">
    <h1>RIDIM VAI</h1>
    <p>3D CINEMATIC EFFECTS</p>
</div>

<div class="hud">

    <div class="hudTop">
        <span>RIDIM // VISUAL ENGINE</span>
        <span>3D MODE // ONLINE</span>
    </div>

    <div class="hudBottom">
        <span class="status">
            <span class="statusDot"></span>
            SYSTEM READY
        </span>

        <span>60 FPS // CINEMATIC</span>
    </div>

</div>

<div class="scanlines"></div>
<div class="vignette"></div>
<div class="flash" id="flash"></div>


<script>

/*
=========================================================
RIDIM VAI
3D CINEMATIC PARTICLE ENGINE
=========================================================
*/

const canvas =
    document.getElementById("scene");

const ctx =
    canvas.getContext("2d");

let width;
let height;

function resize(){

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width * devicePixelRatio;

    canvas.height =
        height * devicePixelRatio;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   3D PARTICLE SYSTEM
===================================================== */

const particles = [];

const COUNT =
    Math.min(
        900,
        Math.floor(width * 1.5)
    );

const FOCAL =
    650;

let cameraZ = 0;

class Particle{

    constructor(){

        this.reset(true);

    }

    reset(initial){

        this.x =
            (Math.random() - .5)
            * 2200;

        this.y =
            (Math.random() - .5)
            * 1400;

        this.z =
            initial
            ? Math.random() * 2200
            : 2200;

        this.speed =
            Math.random() * 12 + 4;

        this.size =
            Math.random() * 2.8 + .4;

        this.alpha =
            Math.random() * .8 + .2;

    }

    update(){

        this.z -= this.speed;

        if(this.z < 1){

            this.reset(false);

        }

    }

    draw(){

        const scale =
            FOCAL / this.z;

        const x =
            width / 2 +
            this.x * scale;

        const y =
            height / 2 +
            this.y * scale;

        const radius =
            this.size * scale;

        if(
            x < -100 ||
            x > width + 100 ||
            y < -100 ||
            y > height + 100
        ){

            return;

        }

        const glow =
            Math.min(
                1,
                scale
            );

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            Math.max(
                .4,
                radius
            ),
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(
                255,
                255,
                255,
                ${this.alpha * glow}
            )`;

        ctx.shadowBlur =
            12 * glow;

        ctx.shadowColor =
            "rgba(100,200,255,.9)";

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}


/* Create particles */

for(
    let i=0;
    i<COUNT;
    i++
){

    particles.push(
        new Particle()
    );

}


/* =====================================================
   3D ENERGY RINGS
===================================================== */

let ringRotation = 0;

function drawRing(
    radius,
    tilt,
    opacity
){

    const cx =
        width / 2;

    const cy =
        height / 2;

    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.rotate(
        ringRotation
    );

    ctx.scale(
        1,
        tilt
    );

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        `rgba(
            255,
            255,
            255,
            ${opacity}
        )`;

    ctx.lineWidth = 1.5;

    ctx.shadowBlur = 20;

    ctx.shadowColor =
        "rgba(0,180,255,.8)";

    ctx.stroke();

    ctx.restore();

}


/* =====================================================
   LIGHT BURST
===================================================== */

let burst = 0;

function drawBurst(){

    if(burst <= 0){

        return;

    }

    const cx =
        width / 2;

    const cy =
        height / 2;

    const radius =
        100 + burst * 600;

    const gradient =
        ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            radius
        );

    gradient.addColorStop(
        0,
        `rgba(255,255,255,${burst * .3})`
    );

    gradient.addColorStop(
        .2,
        `rgba(100,200,255,${burst * .15})`
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    burst *= .94;

}


/* =====================================================
   CAMERA MOVEMENT
===================================================== */

let mouseX = 0;
let mouseY = 0;

window.addEventListener(
    "mousemove",
    event => {

        mouseX =
            (event.clientX /
            width - .5);

        mouseY =
            (event.clientY /
            height - .5);

    }
);


/* =====================================================
   MAIN RENDER LOOP
===================================================== */

let time = 0;

function render(){

    requestAnimationFrame(
        render
    );

    time += .016;

    ctx.fillStyle =
        "rgba(0,0,5,.28)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Camera drift */

    const driftX =
        mouseX * 25;

    const driftY =
        mouseY * 18;


    ctx.save();

    ctx.translate(
        driftX,
        driftY
    );


    /* Rings */

    ringRotation += .004;

    drawRing(
        Math.min(width,height) * .25,
        .28,
        .22
    );

    drawRing(
        Math.min(width,height) * .34,
        .45,
        .12
    );

    drawRing(
        Math.min(width,height) * .43,
        .7,
        .07
    );


    /* Particles */

    particles.sort(
        (a,b) =>
            b.z - a.z
    );

    for(
        const particle of particles
    ){

        particle.update();

        particle.draw();

    }


    ctx.restore();


    drawBurst();

}

render();


/* =====================================================
   TITLE REVEAL
===================================================== */

const title =
    document.getElementById("title");

const flash =
    document.getElementById("flash");


setTimeout(
    () => {

        burst = 1;

        flash.style.opacity =
            ".8";

        setTimeout(
            () => {

                flash.style.transition =
                    "opacity .8s ease";

                flash.style.opacity =
                    "0";

            },
            70
        );


        title.style.opacity =
            "1";

        title.style.transform =
            "translate(-50%,-50%) scale(1)";

        title.classList.add(
            "glitch"
        );

    },
    2200
);


/* =====================================================
   PERIODIC ENERGY PULSE
===================================================== */

setInterval(
    () => {

        burst = .35;

    },
    4200
);


/* =====================================================
   CLICK / TOUCH ENERGY EXPLOSION
===================================================== */

function energyBlast(){

    burst = 1;

    flash.style.transition =
        "none";

    flash.style.opacity =
        ".55";

    setTimeout(
        () => {

            flash.style.transition =
                "opacity .5s ease";

            flash.style.opacity =
                "0";

        },
        60
    );

}

window.addEventListener(
    "click",
    energyBlast
);

window.addEventListener(
    "touchstart",
    energyBlast
);


/* =====================================================
   SPACE = CINEMATIC REPLAY
===================================================== */

window.addEventListener(
    "keydown",
    event => {

        if(
            event.code === "Space"
        ){

            burst = 1;

            title.style.opacity =
                "0";

            title.style.transform =
                "translate(-50%,-50%) scale(.4)";

            setTimeout(
                () => {

                    title.style.opacity =
                        "1";

                    title.style.transform =
                        "translate(-50%,-50%) scale(1)";

                    title.classList.add(
                        "glitch"
                    );

                },
                500
            );

        }

    }
);

</script>

</body>
</html>
